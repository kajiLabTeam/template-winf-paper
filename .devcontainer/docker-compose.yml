services:
  ubuntu-texlive-ja:
    # Built by initializeCommand.sh. Having no "build:" here keeps the Dev Containers
    # extension from building via a temp Dockerfile, which docker compose (bake) rejects.
    image: winf-paper-devcontainer
    pull_policy: never
    command: sleep infinity
    volumes:
      - ../:/workdir
      - ~/.gitconfig:/root/.gitconfig
      - ./.latexmkrc:/root/.latexmkrc
      - ~/.config/git:/root/.config/git
    environment:
      SHELL: "/bin/bash"
